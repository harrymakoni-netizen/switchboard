services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    ports: ["5432:5432"]
    volumes: ["switchboard-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard"]
      interval: 2s
      retries: 20
volumes:
  switchboard-db:
